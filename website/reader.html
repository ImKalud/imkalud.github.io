<!DOCTYPE html>
<html lang="zh-CN">

<head>
        <script>
        (function() {
            try {
                var theme = localStorage.getItem('theme');
                if (!theme) {
                    theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
                }
                if (theme === 'dark') {
                    document.documentElement.classList.add('dark');
                }
            } catch(e) {}
        })();
        </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文章</title>
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/reader.css">
    <link rel="icon" href="../resource/image/icon.png" sizes="16x16"/>
    <script src="../javascript/marked.js"></script>
</head>

<body>
<header>
    <nav>
        <ul>
            <li><a href="article.html">返回</a></li>
            <button id="theme-toggle" class="theme-toggle" title="切换暗夜模式" aria-pressed="false">☀</button>
        </ul>
    </nav>
</header>

<main>
    <div id="article-header">
        <h1 id="title"></h1>
        <div id="meta"></div>
    </div>
    <div id="content"></div>
    <script>
        // Preprocess markdown: strip YAML front-matter, remove BOM, fix resource paths
        function preprocessMarkdown(md) {
            if (!md) return '';
            md = md.replace(/^\uFEFF/, '');
            md = md.replace(/^---[\s\S]*?---\s*/,'');
            md = md.replace(/src=\"\/resource\/(.*?)\"/g, 'src="../resource/$1"');
            md = md.replace(/!\[([^\]]*)\]\((?:\/resource\/)([^)]+)\)/g, function(m, alt, path){
                return `![${alt}](../resource/${path})`;
            });
            return md;
        }

        function getQueryParam(name) {
            const params = new URLSearchParams(window.location.search);
            return params.get(name);
        }

        async function loadArticleById(id) {
            try {
                const listResp = await fetch('../resource/articles.json');
                if (!listResp.ok) throw new Error('无法读取文章列表');
                const list = await listResp.json();
                const idx = Number(id) - 1;
                if (!Number.isFinite(idx) || idx < 0 || idx >= list.length) {
                    document.getElementById('title').textContent = '无效的文章 ID';
                    document.getElementById('content').textContent = '';
                    return;
                }
                const item = list[idx];
                document.getElementById('title').textContent = item.title || '未命名文章';
                document.getElementById('meta').textContent = item.time || '';
                const mdResp = await fetch(item.file);
                if (!mdResp.ok) throw new Error('无法读取文章内容');
                const mdText = await mdResp.text();
                const cleaned = preprocessMarkdown(mdText);
                const html = marked.parse(cleaned || '', { gfm: true, breaks: true });
                document.getElementById('content').innerHTML = html;
                document.getElementById('title').classList.add('articleTitle');
                document.getElementById('content').classList.add('articleContent');
                if (window.__lightbox_attach) try { window.__lightbox_attach(); } catch(e){}
            } catch (e) {
                console.error(e);
                document.getElementById('title').textContent = '加载文章失败';
                document.getElementById('content').textContent = e.message || '';
            }
        }

        const id = getQueryParam('id');
        if (id) {
            loadArticleById(id);
        } else {
            document.getElementById('title').textContent = '未指定文章 ID';
        }
    </script>
</main>

<footer>
    <p>&copy; 2025 ImKalud ❤</p>
</footer>
<script src="../javascript/article.js"></script>
<script src="../javascript/darkmode.js"></script>
<script src="../javascript/lightbox.js"></script>
<script src="../javascript/code-tools.js"></script>
</body>

</html>
